<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gurbani Projection</title><style>
*{box-sizing:border-box}body{background:#000;color:#fff;margin:0;font-family:system-ui,'Noto Sans Gurmukhi',sans-serif}#stage{min-height:100dvh;padding:9vh 5vw 9vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vh;overflow-wrap:anywhere}.verse{font-weight:600;line-height:1.35;max-width:95vw}.meaning{color:#f2d79c;line-height:1.4;max-width:95vw}#clockValue{position:fixed;top:14px;left:20px;font-size:20px;color:#aab}#meta{color:#aaa}#setup{position:fixed;bottom:12px;left:12px;max-width:340px;background:#151a24eF;padding:14px;border:1px solid #4e5667;border-radius:16px;font-family:system-ui,sans-serif;box-shadow:0 6px 30px #000b}#setup.min .body{display:none}input,button{padding:11px;border-radius:9px;background:#263345;border:1px solid #657181;color:white;font:inherit;margin:4px 2px;max-width:100%}button{cursor:pointer}.code{font-size:28px;letter-spacing:5px;color:#f2d79c;font-weight:800}.muted{font-size:13px;color:#bec5d1}.row{display:flex;align-items:center;gap:7px}.grow{flex:1}#hint{font-size:25px;color:#dac28d}#stage:not(.empty) #hint{display:none}
</style></head><body><div id="stage" class="empty"><div id="clockValue"></div><div id="verse" class="verse"></div><div id="meaning" class="meaning"></div><div id="meta"></div><div id="hint">ੴ<br>Ready for Gurbani</div></div><aside id="setup"><div class="row"><strong class="grow">Projection Connection</strong><button id="toggle">Hide</button></div><div class="body"><div class="muted">Projection pairing code</div><div id="code" class="code">•••••</div><div id="status" class="muted">Connecting…</div><div class="row"><input id="controlCode" placeholder="Controller code" inputmode="numeric" maxlength="5" style="width:165px"><button id="join">Join</button></div><input id="name" placeholder="Display name"><div><button id="rename">Save name</button><button id="fullscreen">Fullscreen</button></div><p class="muted">Last projected Gurbani stays visible after controller disconnects. Click Show to reopen settings.</p></div></aside><script>
const $=x=>document.getElementById(x),load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch{return null}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
let session=load('gurbani-screen'),last=load('gurbani-screen-last');
function render(s){if(!s)return;last=s;save('gurbani-screen-last',s);$('code').textContent=s.code||'•••••';$('status').textContent=s.controller?'Paired — ready':'Waiting for controller';if(s.name&&document.activeElement!==$('name'))$('name').value=s.name;const c=s.content||{};$('verse').textContent=c.verse||'';$('meaning').textContent=c.meaning||'';$('meta').textContent=c.meta?'Ang / Page '+c.meta:'';$('verse').style.fontSize=(s.settings?.verseSize||64)+'px';$('meaning').style.fontSize=(s.settings?.meaningSize||28)+'px';$('stage').classList.toggle('empty',!c.verse);$('clockValue').style.display=s.settings?.clock?'block':'none'}
async function init(){try{const d=await api('/api/screen',session||{});session={id:d.screen.id,token:d.screen.token};save('gurbani-screen',session);render(d.screen);refresh()}catch(e){$('status').textContent='Offline — saved slide shown';console.error(e)}}
async function refresh(){if(!session)return;try{const d=await api('/api/screen/state?id='+encodeURIComponent(session.id)+'&token='+encodeURIComponent(session.token));render(d.screen)}catch{$('status').textContent='Offline — last verse remains'}}
$('join').onclick=async()=>{if(!session)return;try{const d=await api('/api/join',{id:session.id,token:session.token,code:$('controlCode').value.trim()});render(d.screen);$('controlCode').value=''}catch(e){$('status').textContent=e.message}};
$('rename').onclick=async()=>{if(!session)return;try{const d=await api('/api/name',{id:session.id,token:session.token,name:$('name').value});render(d.screen)}catch(e){$('status').textContent=e.message}};
$('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();
$('toggle').onclick=()=>{$('setup').classList.toggle('min');$('toggle').textContent=$('setup').classList.contains('min')?'Show':'Hide'};
setInterval(()=>{$('clockValue').textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})},1000);
if(last)render(last);init();setInterval(refresh,2500);
</script></body></html>
