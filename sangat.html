<!doctype html>
<html lang="pa" class="searcher sangat">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0b">
  <title>ਸੰਗਤ ਵਿਊ · Sangat View</title>
  <link rel="stylesheet" href="gurbani-searcher.css">
  <style>
    *{box-sizing:border-box}
    .searcher.sangat body{margin:0;color:#f5f3eb;background:#0b0b0b;font:16px system-ui,"Noto Sans Gurmukhi",sans-serif}
    .sangat-bar{position:sticky;top:0;z-index:10;display:grid;grid-template-columns:1fr auto;align-items:center;gap:5px 12px;padding:12px max(16px,env(safe-area-inset-left)) 10px;background:#171717;border-bottom:1px solid #373737}
    .sangat-bar h1{font-size:19px;font-weight:650;margin:0}
    .sangat-bar .state{color:#b9b3a5;font-size:12px;white-space:nowrap}
    .sangat-bar .state[data-live=true]{color:#efcf88}
    .sangat-bar .details{grid-column:1/-1;color:#b7afa0;margin:0;font-size:12px}
    .sangat-reader{width:min(100%,62rem);margin:auto;min-height:calc(100dvh - 70px);padding:clamp(8px,2vw,16px);touch-action:pan-y;overflow-anchor:none}
    .sangat-reader #lines{padding:12px 3px 24px}
    .sangat-reader .searcher-line{scroll-margin-top:80px}
    .sangat-idle{color:#c1bab0;text-align:center;margin:28vh auto 0;font-size:17px}
    .sangat-waheguru{color:#efcf88;text-align:center;margin:28vh auto 0;font-size:var(--searcher-font,clamp(34px,11vw,90px))}
  </style>
  <script src="gurbani-book-motion.js" defer></script>
  <script src="peerjs-1.5.5.min.js?v=20261118" defer></script>
  <script src="gurbani-peer-manager.js?v=20261133" defer></script>
  <script src="sangat.js?v=2026111602" defer></script>
</head>
<body>
  <div class="sangat-bar">
    <h1>ਸੰਗਤ ਵਿਊ</h1>
    <span class="state" id="liveStatus" role="status">ਉਡੀਕ ਜਾਰੀ ਹੈ</span>
    <p class="details" id="readingDetails" hidden></p>
  </div>
  <main class="sangat-reader" id="reader">
    <p class="sangat-idle" id="waiting">ੴ &nbsp; ਲਾਈਵ ਗੁਰਬਾਣੀ ਦੀ ਉਡੀਕ</p>
    <p class="sangat-waheguru" id="waheguru" hidden>ਵਾਹਿਗੁਰੂ</p>
    <div class="searcher-continuous" id="lines"></div>
  </main>
</body>
</html>
