<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gurbani OBS</title><style>
html,body{margin:0;width:100%;height:100%;background:transparent;color:#fff;font-family:system-ui,"Noto Sans Gurmukhi",sans-serif}#text{box-sizing:border-box;width:100%;min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2%;gap:.15em;overflow-wrap:anywhere;text-shadow:2px 2px 3px #000}.line{font-size:clamp(22px,4.2vw,85px);line-height:1.2}.meaning{font-size:clamp(16px,2.4vw,46px);color:#ffdf9b;line-height:1.25}
#topArea,#bottomArea{position:fixed;left:0;width:100%;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;pointer-events:none;padding:0 2%;box-sizing:border-box}#topArea{top:1vh}#bottomArea{bottom:1vh}#topArea .line,#bottomArea .line{max-width:100%;line-height:1.16;overflow-wrap:anywhere}#text{display:none} </style></head><body><main id="text"></main><section id="topArea"></section><section id="bottomArea"></section><script src="peerjs-1.5.5.min.js"></script><script src="gurbani-peer-manager.js?v=20261113-stablecode"></script><script>
'use strict';
const code=new URLSearchParams(location.search).get('code')||'',root=document.getElementById('text'),key='gb-obs-owner-'+code;
let owner=localStorage.getItem(key),peer,connections=new Set(),data=null,options={order:['sg','sh','se','mp','mh','me'],enabled:['sg']};
function draw(){const top=document.getElementById('topArea'),bottom=document.getElementById('bottomArea');top.replaceChildren();bottom.replaceChildren();if(!data)return;const v=data.obsData||{},slots=options.slots||{},sizes=options.sizes||{};for(const k of options.order||[]){if(!options.enabled.includes(k)||!v[k])continue;const el=document.createElement('div');el.className='line'+(k[0]==='m'?' meaning':'');el.textContent=v[k];el.style.fontSize=Math.min(200,Math.max(14,Number(sizes[k])|| (k[0]==='m'?38:70)))+'px';(slots[k]==='bottom'||(!slots[k]&&k[0]==='m')?bottom:top).append(el)}}
function send(c,m){try{if(c.open)c.send(m)}catch(_){}}
function attach(c){connections.add(c);c.on('open',()=>send(c,{type:'hello',code,deviceId:code,name:'OBS Text',kind:'obs',owner}));c.on('data',m=>{if(!m||typeof m!=='object')return;if(m.type==='ping'){send(c,{type:'pong',id:m.id});return}if(m.type==='auth'&&typeof m.token==='string'){if(owner&&owner!==m.token){send(c,{type:'rejected'});return}owner=m.token;localStorage.setItem(key,owner);send(c,{type:'accepted',code,deviceId:code,name:'OBS Text',kind:'obs'})}if(m.type==='remove-pairing'&&owner&&m.token===owner){owner=null;localStorage.removeItem(key);send(c,{type:'unpaired'});try{c.close()}catch(_){}return}if(m.type==='project'&&owner&&m.token===owner){if(Object.prototype.hasOwnProperty.call(m,'content'))data=m.content;if(m.obsSettings&&Array.isArray(m.obsSettings.order)&&Array.isArray(m.obsSettings.enabled))options=m.obsSettings;draw();if(m.rev!==undefined)send(c,{type:'applied',rev:m.rev})}});c.on('close',()=>connections.delete(c));c.on('error',()=>connections.delete(c))}
if(/^\d{5}$/.test(code)&&window.GurbaniPeer)GurbaniPeer.start({id:()=> 'gurbani-projection-v1-'+code,onPeer:p=>{peer=p},onStatus:()=>{},onOpen:()=>{},onConnection:attach,onCollision:()=>{},onTargetUnavailable:()=>{}});
</script></body></html>
