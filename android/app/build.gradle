plugins { id 'com.android.application' }
android {
    namespace 'in.gurbanisearch.app'
    compileSdk 35
    defaultConfig {
        applicationId 'in.gurbanisearch'
        minSdk 23
        targetSdk 35
        versionCode 20261128
        versionName '2026.11.13.17'
    }
    flavorDimensions += 'role'
    productFlavors {
        controller {
            dimension 'role'
            applicationIdSuffix '.controller'
            resValue 'string', 'app_name', 'Gurbani Searching Control'
            buildConfigField 'String', 'START_PAGE', '"index.html"'
            buildConfigField 'String', 'ROLE', '"controller"'
        }
        searcher {
            dimension 'role'
            versionCode 20261129
            versionName '2026.11.14.2'
            applicationIdSuffix '.searcher'
            resValue 'string', 'app_name', 'Gurbani Searcher'
            buildConfigField 'String', 'START_PAGE', '"searcher.html"'
            buildConfigField 'String', 'ROLE', '"searcher"'
        }
        projection {
            dimension 'role'
            versionCode 20261129
            versionName '2026.11.14.1'
            applicationIdSuffix '.projection'
            resValue 'string', 'app_name', 'Gurbani Searching Projection'
            buildConfigField 'String', 'START_PAGE', '"projection.html"'
            buildConfigField 'String', 'ROLE', '"projection"'
        }
        camera {
            dimension 'role'
            applicationIdSuffix '.camera'
            resValue 'string', 'app_name', 'Gurbani Searching Camera'
            buildConfigField 'String', 'START_PAGE', '"camera.html"'
            buildConfigField 'String', 'ROLE', '"camera"'
        }
        book {
            dimension 'role'
            applicationIdSuffix '.book'
            resValue 'string', 'app_name', 'Gurbani Granth View'
            buildConfigField 'String', 'START_PAGE', '"book.html"'
            buildConfigField 'String', 'ROLE', '"book"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
