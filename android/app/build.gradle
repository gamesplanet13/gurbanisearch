plugins { id 'com.android.application' }
android {
    namespace 'in.gurbanisearch.app'
    compileSdk 35
    defaultConfig {
        applicationId 'in.gurbanisearch'
        minSdk 23
        targetSdk 35
        versionCode 20261116
        versionName '2026.11.12.6'
    }
    flavorDimensions += 'role'
    productFlavors {
        controller {
            dimension 'role'
            applicationIdSuffix '.controller'
            resValue 'string', 'app_name', 'Gurbani Controller'
            buildConfigField 'String', 'START_PAGE', '"index.html"'
            buildConfigField 'String', 'ROLE', '"controller"'
        }
        projection {
            dimension 'role'
            applicationIdSuffix '.projection'
            resValue 'string', 'app_name', 'Gurbani Projection'
            buildConfigField 'String', 'START_PAGE', '"projection.html"'
            buildConfigField 'String', 'ROLE', '"projection"'
        }
        book {
            dimension 'role'
            applicationIdSuffix '.book'
            resValue 'string', 'app_name', 'Gurbani Book View'
            buildConfigField 'String', 'START_PAGE', '"book.html"'
            buildConfigField 'String', 'ROLE', '"book"'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}