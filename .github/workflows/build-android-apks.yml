name: Build Controller and Projection APKs
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apks.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build both debug APKs
        working-directory: android
        run: gradle --no-daemon assembleControllerDebug assembleProjectionDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gurbani-Controller-APK
          path: android/app/build/outputs/apk/controller/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Gurbani-Projection-APK
          path: android/app/build/outputs/apk/projection/debug/*.apk
